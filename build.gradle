plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.107'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// maven.neoforged.net 在本机 443/80 全部超时且 DNS 被污染，改用社区镜像 neoforged.forgecdn.net
repositories {
    maven {
        name = 'NeoForged Mirror'
        url = 'https://neoforged.forgecdn.net/releases'
    }
    maven {
        name = 'NeoForged Mirror Mojang Meta'
        url = 'https://neoforged.forgecdn.net/mojang-meta'
    }
    mavenCentral()
    maven {
        name = 'Xander Maven'
        url = 'https://maven.isxander.dev/releases'
    }
}

// MDG injects the official NeoForged repository itself; drop it so Gradle does not
// wait for each unreachable CDN node before falling through to the mirror
afterEvaluate {
    repositories.removeAll {
        it instanceof MavenArtifactRepository &&
                it.url.toString().contains('maven.neoforged.net')
    }
}

neoForge {
    // Parchment (可选，官方 Mojmap 即可编译)
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version_range   : neo_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

dependencies {
    // MDG adds the NeoForge dependency itself from neoForge.version
    // YACL (可选依赖): 编译时可见，运行时可缺省（反射加载）
    compileOnly "dev.isxander:yet-another-config-lib:${yacl_version}"
    // 开发运行时也加载，便于 runClient 直接测试 GUI
    runtimeOnly "dev.isxander:yet-another-config-lib:${yacl_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'MixinConfigs'            : "${mod_id}.mixins.json",
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}