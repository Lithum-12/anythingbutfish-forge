buildscript {
    repositories {
        // SpongePowered 仓库（用于 Mixin 注解处理器）
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        // MixinGradle 插件，用于处理 Mixin 的编译与重映射
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse' // Eclipse IDE 支持
    id 'idea' // IntelliJ IDEA 支持
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)' // ForgeGradle 插件
}

apply plugin: 'org.spongepowered.mixin' // 应用 Mixin 插件

group = mod_group_id // 模组组 ID
version = mod_version // 模组版本

base {
    archivesName = mod_id // 生成的 jar 文件名
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17) // 使用 Java 17
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version // 使用官方映射
    copyIdeResources = true // 将资源文件复制到 IDE 运行目录

    runs {
        configureEach {
            workingDirectory project.file('run') // 运行目录
            property 'forge.logging.markers', 'REGISTRIES' // 日志标记
            property 'forge.logging.console.level', 'debug' // 控制台日志级别

            mods {
                "${mod_id}" {
                    source sourceSets.main // 使用主源码集
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id // 启用游戏测试
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui' // 无图形界面模式
        }

        data {
            workingDirectory project.file('run-data') // 数据生成运行目录
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/') // 数据生成参数
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json" // 生成重映射文件
    config "${mod_id}.mixins.json" // Mixin 配置文件
}

sourceSets.main.resources { srcDir 'src/generated/resources' } // 将生成资源加入主资源目录

repositories {
    // Xander Maven 仓库（用于 YACL，如果后续需要 GUI）
    maven {
        name = 'Xander Maven'
        url = 'https://maven.isxander.dev/releases'
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}" // Forge 依赖

    // Mixin 注解处理器
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // YACL（可选依赖）
    // compileOnly 保证编译时可用，但不会打包进你的 jar
    compileOnly fg.deobf("dev.isxander:yet-another-config-lib:${yacl_version}")
    // runtimeOnly 让你在 runClient 开发环境中能直接看到 GUI
    runtimeOnly fg.deobf("dev.isxander:yet-another-config-lib:${yacl_version}")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project] // 替换模板中的占位符
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar' // 重新混淆 jar
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // 使用 UTF-8 编码
}