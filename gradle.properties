# Gradle settings (ModDevGradle needs more memory)
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Prefer IPv4 to avoid connection resets on some networks
systemProp.java.net.preferIPv4Stack=true

# Java version (NeoForge 1.21.1 requires Java 21)
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.11.10-hotspot

# Target Minecraft & NeoForge versions
minecraft_version=1.21.1
minecraft_version_range=[1.21,1.21.2)
neo_version=21.1.249
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Mod Metadata
# Versioning scheme (MAJOR.MINOR):
#   MAJOR - incremented by 1 for every major update (new features / systems).
#           Reset is NOT applied to MAJOR; it only ever grows.
#   MINOR - the number of files changed in the release commit.
#           Reset to the changed-file count on a major update;
#           accumulates across minor-only updates.
mod_id=anythingbutfish
mod_name=AnythingButFish
mod_license=LGPLv3
mod_version=24.20
mod_group_id=io.github.lithum12
mod_authors=LithumC
mod_description=Replaces vanilla fishing loot with completely random items, entities, and experience orbs. Who knows what you'll reel in next?

# YACL for NeoForge 1.21.1
yacl_version=3.8.1+1.21.1-neoforge